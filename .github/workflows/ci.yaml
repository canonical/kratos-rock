name: ci
run-name: CI for ${{ github.sha }} on ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "1/stable"
    paths:
      - "rockcraft.yaml"
      - ".github/workflows/**.yaml"
  pull_request:
    branches:
      - "*"

jobs:
  build:
    uses: canonical/identity-team/.github/workflows/_rock-build.yaml@00995831ff788db43992012900820edf7967305f # v1.19.2
    with:
      structure-tests-enabled: true
  gh-publish:
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/1/stable' }}
    needs: build
    uses: canonical/identity-team/.github/workflows/_rock-gh-publish-third-party.yaml@00995831ff788db43992012900820edf7967305f # v1.19.2
    with:
      rock: ${{ needs.build.outputs.rock }}
  oci-publish:
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/1/stable' }}
    needs: build
    uses: canonical/identity-team/.github/workflows/_rock-oci-publish.yaml@00995831ff788db43992012900820edf7967305f # v1.19.2
    with:
      edge-release: false
      eol-stable-release: "3 month"
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
  scan:
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/1/stable' }}
    needs: gh-publish
    uses: canonical/identity-team/.github/workflows/_rock-scan.yaml@00995831ff788db43992012900820edf7967305f # v1.19.2
    with:
      image: ${{ needs.gh-publish.outputs.image }}
  oci-update-pr:
    needs: [gh-publish, scan]
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/1/stable' }}
    uses: canonical/identity-team/.github/workflows/oci-update-pr.yaml@00995831ff788db43992012900820edf7967305f # v1.19.2
    with:
        oci-image: ${{ needs.gh-publish.outputs.image }}
        repository: canonical/kratos-operator
    secrets:
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
