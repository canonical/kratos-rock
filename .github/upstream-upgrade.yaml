# Configuration for canonical/identity-team upstream-upgrade workflows.
# Upstream repository, tag prefix, and rock image are auto-detected from rockcraft.yaml.

trusted_link_hosts:
  - www.ory.sh

charms:
  - key: kratos
    repo: canonical/kratos-operator
    description: >-
      Deploys Ory Kratos identity and user management server backed by
      PostgreSQL behind ingress.
    files:
      - charmcraft.yaml
      - src/charm.py
      - src/cli.py
      - src/clients.py
      - src/configs.py
      - src/constants.py
      - src/env_vars.py
      - src/integrations.py
      - src/services.py
